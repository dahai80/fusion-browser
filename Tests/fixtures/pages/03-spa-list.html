<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customers — Acme Cloud</title>
<style>
:root{--primary:#2563eb;--bg:#f1f5f9;--surface:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--hover:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:24px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
header h1{font-size:22px;font-weight:600}
header .actions{display:flex;gap:8px}
.btn{height:36px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.filter{display:flex;gap:8px;flex:1}
.filter select{height:36px;padding:0 28px 0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:14px;cursor:pointer}
.search{flex:1;position:relative}
.search input{width:100%;height:36px;padding:0 12px 0 34px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.search svg{position:absolute;left:10px;top:9px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.list-head{display:grid;grid-template-columns:40px 1fr 160px 120px 140px 100px;padding:10px 16px;background:var(--hover);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:500}
.row{display:grid;grid-template-columns:40px 1fr 160px 120px 140px 100px;padding:12px 16px;border-top:1px solid var(--border);align-items:center}
.row:hover{background:var(--hover)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
.name{font-weight:500}
.name small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.email{color:var(--muted);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500}
.tag.active{background:#dcfce7;color:#16a34a}.tag.trial{background:#fef3c7;color:#d97706}.tag.churned{background:#fee2e2;color:#dc2626}
.plan{font-size:13px}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.icon-btn{width:30px;height:30px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:13px}
.icon-btn:hover{background:var(--hover)}
.empty{padding:48px;text-align:center;color:var(--muted)}
.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--muted)}
.pagination .pages{display:flex;gap:4px}
.pagination a{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--border);border-radius:6px;text-decoration:none;color:var(--text)}
.pagination a.current{background:var(--primary);color:#fff;border-color:var(--primary)}
.bulk{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:none;align-items:center;justify-content:space-between}
.bulk.show{display:flex}
@media(max-width:768px){.list-head,.row{grid-template-columns:40px 1fr 100px}.email,.plan,.row-actions .label-only{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Customers</h1>
    <div class="actions">
      <a class="btn" id="export" href="/customers/export">Export</a>
      <a class="btn primary" id="import" href="/customers/import">Import</a>
    </div>
  </header>
  <div class="toolbar">
    <div class="filter">
      <select id="filter-status"><option value="">All statuses</option><option>Active</option><option>Trial</option><option>Churned</option></select>
      <select id="filter-plan"><option value="">All plans</option><option>Free</option><option>Pro</option><option>Enterprise</option></select>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Search customers…">
    </div>
  </div>
  <div class="list" id="list">
    <div class="list-head"><div></div><div>Name</div><div>Email</div><div>Status</div><div>Plan</div><div></div></div>
    <div id="rows"><!-- rows injected by script --></div>
    <div class="bulk" id="bulk">
      <span id="bulk-count">0 selected</span>
      <div><button class="btn" id="bulk-tag">Tag</button> <button class="btn" id="bulk-delete">Delete</button></div>
    </div>
  </div>
  <div class="pagination">
    <span id="page-info">Page 1 of 12 · 348 customers</span>
    <div class="pages">
      <a id="prev" href="?p=1">‹</a>
      <a class="current" id="p1" href="?p=1">1</a>
      <a id="p2" href="?p=2">2</a>
      <a id="p3" href="?p=3">3</a>
      <a id="p4" href="?p=4">4</a>
      <a id="next" href="?p=2">›</a>
    </div>
  </div>
</div>
<script>
(function(){
  var rows=document.getElementById('rows');
  var data=[{n:'Sara Kim',e:'sara@acme.io',s:'active',p:'Pro',i:'SK'},{n:'Jay Doe',e:'jay@example.com',s:'trial',p:'Free',i:'JD'},{n:'Mei Lin',e:'mei@acme.io',s:'active',p:'Enterprise',i:'ML'},{n:'Raj Anand',e:'raj@example.com',s:'churned',p:'Pro',i:'RA'},{n:'Nina Costa',e:'nina@acme.io',s:'active',p:'Pro',i:'NC'},{n:'Tom Wright',e:'tom@example.com',s:'trial',p:'Free',i:'TW'},{n:'Olga Petrov',e:'olga@acme.io',s:'active',p:'Enterprise',i:'OP'},{n:'Sam Lee',e:'sam@example.com',s:'active',p:'Pro',i:'SL'}];
  function render(list){var h='';list.forEach(function(c,idx){h+='<div class=row><div><span class=avatar>'+c.i+'</span></div><div class=name>'+c.n+'<small>Customer #'+(1000+idx)+'</small></div><div class=email>'+c.e+'</div><div><span class="tag '+c.s+'">'+c.s+'</span></div><div class=plan>'+c.p+'</div><div class=row-actions><button class=icon-btn id=edit-'+idx+' title=Edit>✎</button><button class=icon-btn id=del-'+idx+' title=Delete>🗑</button></div></div>'});rows.innerHTML=h;window.__fbMap&&window.__fbMap.clear&&window.__fbMap.clear()}
  render(data);
  window.__analytics=window.__analytics||[];
  function track(ev,props){window.__analytics.push({ev:ev,props:props,ts:Date.now()})}
  track('list_view');
  var fs=document.getElementById('filter-status'),fp=document.getElementById('filter-plan'),q=document.getElementById('search');
  function applyFilter(){var status=fs.value.toLowerCase(),plan=fp.value.toLowerCase(),text=q.value.toLowerCase();var f=data.filter(function(c){return (!status||c.s===status)&&(!plan||c.p===plan)&&(!text||(c.n+c.e).toLowerCase().indexOf(text)>=0)});render(f);track('filter_applied',{status:status,plan:plan,q:text})}
  fs.addEventListener('change',applyFilter);fp.addEventListener('change',applyFilter);
  var t;q.addEventListener('input',function(){clearTimeout(t);t=setTimeout(applyFilter,300)});
  rows.addEventListener('click',function(e){var t=e.target;if(t.id&&t.id.indexOf('edit-')===0){track('row_edit',{id:t.id})}else if(t.id&&t.id.indexOf('del-')===0){track('row_delete',{id:t.id})}});
  document.getElementById('prev').addEventListener('click',function(e){e.preventDefault();track('page_prev')});
  document.getElementById('next').addEventListener('click',function(e){e.preventDefault();track('page_next')});
  ['p1','p2','p3','p4'].forEach(function(id){var el=document.getElementById(id);if(el)el.addEventListener('click',function(e){e.preventDefault();track('page_jump',{p:id})})});
  var bulk=document.getElementById('bulk');
  document.getElementById('bulk-tag').addEventListener('click',function(){track('bulk_tag')});
  document.getElementById('bulk-delete').addEventListener('click',function(){track('bulk_delete')});
  document.getElementById('export').addEventListener('click',function(){track('export_click')});
  document.getElementById('import').addEventListener('click',function(){track('import_click')});
})();
</script>
</body>
</html>
