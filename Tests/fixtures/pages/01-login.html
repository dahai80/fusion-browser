<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Acme Cloud</title>
<style>
:root{--primary:#2563eb;--bg:#f8fafc;--surface:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--error:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:420px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.04)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.logo{width:36px;height:36px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:700}
.brand h1{font-size:18px;font-weight:600}
.brand span{font-size:13px;color:var(--muted)}
h2{font-size:22px;font-weight:600;margin-bottom:6px}
.subtitle{font-size:14px;color:var(--muted);margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.field input{width:100%;height:42px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;font-size:13px}
.row label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.btn{width:100%;height:44px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:#1d4ed8}
.btn:active{background:#1e40af}
.link{color:var(--primary);text-decoration:none}
.link:hover{text-decoration:underline}
.divider{height:1px;background:var(--border);margin:24px 0}
.foot{text-align:center;font-size:13px;color:var(--muted)}
.foot a{margin:0 8px}
.err{display:none;background:#fef2f2;color:var(--error);border:1px solid #fecaca;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px}
.cap{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
@media(max-width:480px){.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand"><div class="logo">A</div><div><h1>Acme Cloud</h1><span>Console</span></div></div>
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your account to continue.</p>
    <div class="err" id="err">Invalid email or password. Please try again.</div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <div class="row">
        <label><input id="remember" type="checkbox" name="remember">Remember me</label>
        <a class="link" id="forgot" href="/forgot">Forgot password?</a>
      </div>
      <button class="btn" id="submit" type="submit">Sign in</button>
    </form>
    <div class="divider"></div>
    <div class="foot">Don't have an account? <a class="link" id="signup" href="/signup">Sign up</a></div>
    <div class="foot"><a class="link" id="terms" href="/terms">Terms</a><a class="link" id="privacy" href="/privacy">Privacy</a></div>
    <p class="cap">Protected by reCAPTCHA. This site uses cookies to enhance your experience.</p>
  </div>
</div>
<script>
(function(){
  var f=document.getElementById('loginForm');
  if(!f) return;
  var err=document.getElementById('err');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var em=document.getElementById('email').value;
    var pw=document.getElementById('password').value;
    if(!em||!pw){err.style.display='block';return;}
    err.style.display='none';
    var btn=document.getElementById('submit');
    btn.disabled=true;btn.textContent='Signing in…';
    fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})})
      .then(function(r){return r.json()})
      .then(function(d){if(d.ok){window.location.href=d.redirect||'/app';}else{err.style.display='block';btn.disabled=false;btn.textContent='Sign in';}})
      .catch(function(){err.style.display='block';btn.disabled=false;btn.textContent='Sign in';});
  });
  window.__analytics=window.__analytics||[];
  function track(ev,props){window.__analytics.push({ev:ev,props:props,ts:Date.now()})}
  track('login_page_view',{ref:document.referrer});
  var em=document.getElementById('email');
  em.addEventListener('blur',function(){track('email_blur')});
})();
</script>
</body>
</html>
