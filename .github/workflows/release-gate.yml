name: release-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# R-6 / B-6: CI regression gate for the live WKWebView path.
#
# ARCH-3: WKWebView completion handlers dispatch to main; under `swift test` there is
# no main run loop, so evaluateJSSync/screenshotSync semaphores deadlock. The 198 unit
# tests are deterministic (no live webview). The live automation surface is verified
# ONLY by the built release binary + the Python harnesses in scripts/ (release_gate.sh).
#
# Two jobs:
#   build-and-test  — GitHub-hosted macOS-15 arm64. swift build + swift test (198).
#                     Fast, reliable, no special runner. Proves the package compiles
#                     and deterministic tests pass on a clean machine. NOTE: macOS-14
#                     image ships Swift 5.10 only — the package needs Swift 6.0
#                     (Package.swift swift-tools-version 6.0.0), so macOS-15 is required.
#   live-path-gate  — self-hosted macOS runner with a GUI session (WKWebView needs a
#                     CoreGraphics display + main run loop to navigate/evaluate/screenshot)
#                     AND a running fusion-mlx inference engine (uma_coexist samples
#                     MLX resident memory). Runs the full scripts/release_gate.sh.
#                     Required: runner labeled [self-hosted, macos, arm64, gui]. On a
#                     runner without fusion-mlx, set SKIP_UMA=1 to drop the one MLX
#                     harness (the other 8 live harnesses need only the GUI session).
#
# Both jobs must pass to merge a PR (branch protection: required status check =
# "build-and-test" + "live-path-gate"). Failures block merge per the R-6 验收标准.

jobs:
  build-and-test:
    name: build + unit tests (deterministic)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release --disable-sandbox

      - name: Unit tests (198, deterministic — no live WKWebView)
        run: swift test --disable-sandbox

  live-path-gate:
    name: live WKWebView path (release_gate.sh)
    needs: build-and-test
    # Self-hosted macOS runner with a GUI session. WKWebView cannot run headless on a
    # CoreGraphics-less CI box; a GitHub-hosted runner has no persistent GUI session
    # for a long-lived binary driving real navigations. Label set:
    #   self-hosted + macos + arm64 + gui
    runs-on: [self-hosted, macos, arm64, gui]
    timeout-minutes: 45
    env:
      # fusion-mlx API key for uma_coexist. On the self-hosted runner this is set in
      # the runner's env or Actions secrets. If the runner has no fusion-mlx, set
      # SKIP_UMA=1 to drop only the MLX harness (7 of 8 live harnesses still run).
      SKIP_UMA: ${{ vars.SKIP_UMA || '0' }}
      FUSION_MLX_API_KEY: ${{ secrets.FUSION_MLX_API_KEY }}
    steps:
      - name: Route git over SSH (HTTPS to github.com blocked on runner host)
        # The self-hosted runner host cannot reach github.com:443 (HTTPS times out),
        # but port 22 (SSH) works with the runner user's existing SSH key. Rewrite
        # https://github.com/ -> git@github.com: so actions/checkout's fetch uses SSH.
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Ensure fusion-mlx reachable (uma_coexist precondition)
        if: env.SKIP_UMA != '1'
        run: |
          # fusion-mlx /v1/models is Bearer-gated; -sf exits non-zero on a 401/5xx.
          # FUSION_MLX_API_KEY is the admin key (set as a repo secret). A missing
          # key or unreachable engine makes uma_coexist impossible -> fail fast.
          if [[ -z "$FUSION_MLX_API_KEY" ]]; then
            echo "::warning::FUSION_MLX_API_KEY secret not set; set it or SKIP_UMA=1"
            exit 1
          fi
          curl -sf -H "Authorization: Bearer $FUSION_MLX_API_KEY" \
            http://localhost:11434/v1/models >/dev/null 2>&1 \
            || { echo "::warning::fusion-mlx not reachable on :11434 (or key rejected); set SKIP_UMA=1 or start it"; exit 1; }

      - name: Run release gate (build + 198 tests + 9 live harnesses)
        run: |
          if [[ "$SKIP_UMA" == "1" ]]; then
            # Drop the one MLX-dependent harness; keep the other 8 live harnesses.
            chmod +x scripts/release_gate.sh
            EXCLUDE=scripts/uma_coexist.py
            # Run the gate harnesses individually, skipping the excluded one.
            swift build -c release --disable-sandbox
            swift test --disable-sandbox
            for h in scripts/verify_nonpersistent.py scripts/navigate_execute_smoke.py \
                     scripts/evaluate_smoke.py scripts/cdp_dom_smoke.py \
                     scripts/cdp_event_smoke.py scripts/metrics_smoke.py \
                     scripts/longrun_leak.py scripts/ownership_smoke.py; do
              [[ -f "$h" ]] && { echo "::group::live: $h"; python3 "$h" || exit 1; echo "::endgroup::"; }
            done
          else
            scripts/release_gate.sh
          fi

      - name: Upload harness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-path-reports
          path: |
            scripts/*-report.json
            scripts/*.log
          if-no-files-found: ignore
          retention-days: 14
